# AuthFleet — Nginx reverse proxy
# Place at: /etc/nginx/sites-available/authfleet
# Enable with: ln -s /etc/nginx/sites-available/authfleet /etc/nginx/sites-enabled/
#
# HTTP-only here on purpose — certbot --nginx will append the HTTPS server
# block with the right ssl_certificate paths after Let's Encrypt issues
# the cert. Having 'listen 443 ssl' here with commented certs crashes
# `nginx -t` with 'no "ssl_certificate" defined for listen ssl directive'.

server {
    listen 80;
    listen [::]:80;
    server_name authfleet.yourdomain.com;

    # Certbot challenge directory (used by `certbot --nginx`)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Security headers (apply before HTTPS upgrade too — defensive)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Rate limit on OTP endpoints (defense-in-depth; API key argon2 is primary gate)
    location /api/v1/otp/ {
        limit_req zone=authfleet_otp burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Max body size (OAuth flows are small; keep tight)
    client_max_body_size 1m;
}

# Required in /etc/nginx/nginx.conf inside http {} block (install.sh adds this):
# limit_req_zone $binary_remote_addr zone=authfleet_otp:10m rate=30r/m;
