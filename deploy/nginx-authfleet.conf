# AuthFleet — Nginx reverse proxy
# Place at: /etc/nginx/sites-available/authfleet
# Enable with: ln -s /etc/nginx/sites-available/authfleet /etc/nginx/sites-enabled/
# After `certbot --nginx -d authfleet.yourdomain.com` runs, certbot will edit
# this file to inject SSL blocks. The HTTPS server below is a starting point —
# certbot's edit is the source of truth after first run.

server {
    listen 80;
    listen [::]:80;
    server_name authfleet.yourdomain.com;

    # Certbot challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything else redirects to HTTPS (certbot usually sets this up)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name authfleet.yourdomain.com;

    # Certbot will fill these in after running `certbot --nginx`
    # ssl_certificate /etc/letsencrypt/live/authfleet.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/authfleet.yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Rate limit on OTP endpoints (defense-in-depth; API key argon2 is primary gate)
    location /api/v1/otp/ {
        limit_req zone=authfleet_otp burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Max body size (OAuth flows are small; keep tight)
    client_max_body_size 1m;
}

# Add this to /etc/nginx/nginx.conf inside the http {} block, once:
# limit_req_zone $binary_remote_addr zone=authfleet_otp:10m rate=30r/m;
